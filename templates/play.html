<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IBSEN · 인터랙티브 드라마</title>
<style>
  :root {
    --bg: #14151a; --panel: #1d1f27; --panel2: #262935;
    --ink: #e8e9ee; --muted: #9aa0af; --line: #333748;
    --accent: #6ea8fe; --accent2: #3d8b40; --narr: #8b90a0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    line-height: 1.6;
  }
  .wrap { max-width: 860px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
  .hidden { display: none !important; }
  button { font-family: inherit; cursor: pointer; }
  h1, h2 { font-weight: 700; }

  /* --- 시작/로딩 화면 --- */
  .center { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 32px; width: 100%; max-width: 560px; }
  .card h1 { margin: 0 0 4px; font-size: 24px; }
  .card .sub { color: var(--muted); margin-bottom: 24px; font-size: 14px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 16px 0 6px; }
  input[type=text], textarea, select {
    width: 100%; background: var(--panel2); color: var(--ink);
    border: 1px solid var(--line); border-radius: 10px; padding: 12px; font-size: 15px;
  }
  .scenario { border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-top: 10px; cursor: pointer; background: var(--panel2); }
  .scenario.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .scenario .t { font-weight: 700; }
  .scenario .i { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .scenario .tag { font-size: 11px; color: var(--accent); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; margin-left: 6px; }
  .primary { width: 100%; margin-top: 24px; background: var(--accent); color: #0b1020; border: none; border-radius: 10px; padding: 14px; font-size: 16px; font-weight: 700; }
  .primary:disabled { opacity: .5; cursor: not-allowed; }
  .spinner { width: 34px; height: 34px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* --- 플레이 화면 --- */
  header.bar { background: var(--panel); border-bottom: 1px solid var(--line); padding: 12px 16px; position: sticky; top: 0; z-index: 5; }
  .bar .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .bar .title { font-weight: 700; }
  .bar .scene { color: var(--accent); font-size: 13px; background: var(--panel2); padding: 3px 10px; border-radius: 999px; }
  .scenes { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .chip { background: var(--panel2); border: 1px solid var(--line); color: var(--ink); border-radius: 999px; padding: 6px 12px; font-size: 13px; }
  .chip.cur { border-color: var(--accent2); color: #cdeccd; }
  .chip:disabled { opacity: .5; }

  #chat { flex: 1; overflow-y: auto; padding: 20px 16px 8px; }
  .msg { margin: 14px 0; max-width: 80%; }
  .msg .who { font-size: 12px; color: var(--muted); margin-bottom: 3px; }
  .msg .bubble { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; display: inline-block; white-space: pre-wrap; }
  .msg.player { margin-left: auto; text-align: right; }
  .msg.player .bubble { background: #24406b; border-color: #315a94; }
  .msg.narration { max-width: 100%; text-align: center; }
  .msg.narration .bubble { background: transparent; border: none; color: var(--narr); font-style: italic; }
  .msg .bubble.c0 { border-left: 3px solid #6ea8fe; }
  .msg .bubble.c1 { border-left: 3px solid #f0c674; }
  .msg .bubble.c2 { border-left: 3px solid #7ec27e; }
  .msg .bubble.c3 { border-left: 3px solid #c792ea; }
  .msg .bubble.c4 { border-left: 3px solid #82d2e5; }
  .msg .bubble.c5 { border-left: 3px solid #e58f8f; }

  .thinking { color: var(--muted); font-size: 13px; padding: 6px 16px; }
  .dot { animation: blink 1.2s infinite; }
  .dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
  @keyframes blink { 0%,100%{opacity:.2} 50%{opacity:1} }

  footer.input { background: var(--panel); border-top: 1px solid var(--line); padding: 12px 16px; position: sticky; bottom: 0; }
  .await-tip { color: var(--accent2); font-size: 13px; margin-bottom: 8px; }
  .inrow { display: flex; gap: 8px; }
  .inrow input { flex: 1; }
  .btn { background: var(--panel2); border: 1px solid var(--line); color: var(--ink); border-radius: 10px; padding: 12px 14px; font-size: 14px; white-space: nowrap; }
  .btn.send { background: var(--accent); color: #0b1020; border: none; font-weight: 700; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .toolrow { display: flex; gap: 8px; margin-top: 8px; }

  /* --- 모달(인터뷰 / 평가) --- */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 20; }
  .modal { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 24px; width: 100%; max-width: 560px; max-height: 86vh; overflow-y: auto; }
  .modal h2 { margin: 0 0 12px; font-size: 19px; }
  .actorlist { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .ivlog { background: var(--panel2); border-radius: 10px; padding: 12px; min-height: 60px; margin: 12px 0; max-height: 40vh; overflow-y: auto; }
  .ivlog .q { color: var(--accent); margin-top: 8px; }
  .ivlog .a { margin-top: 2px; white-space: pre-wrap; }
  .stars { font-size: 26px; letter-spacing: 4px; user-select: none; }
  .stars span { cursor: pointer; color: #55596b; }
  .stars span.on { color: #f0c674; }
  .modal .close { background: none; border: none; color: var(--muted); float: right; font-size: 20px; }
  .err { color: #e58f8f; font-size: 13px; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">

  <!-- 1. 시작 화면 -->
  <section id="screen-start" class="center">
    <div class="card">
      <h1>🎭 IBSEN 인터랙티브 드라마</h1>
      <div class="sub">AI 배우들과 대화하며 극을 만들어갑니다. 이름을 적고 시나리오를 골라 시작하세요.</div>
      <label>이름 (또는 별명)</label>
      <input id="name" type="text" placeholder="예: 김학생" maxlength="40" autocomplete="off">
      <label>시나리오</label>
      <div id="scenarios"></div>
      <button id="startBtn" class="primary" disabled>시작하기</button>
      <div id="startErr" class="err"></div>
    </div>
  </section>

  <!-- 2. 로딩 화면 -->
  <section id="screen-loading" class="center hidden">
    <div class="card" style="text-align:center">
      <div class="spinner"></div>
      <h1 style="font-size:19px">배우들이 배역과 기억을 준비하는 중…</h1>
      <div class="sub" id="loadingMsg">약 1분 정도 걸립니다. 잠시만 기다려주세요.</div>
    </div>
  </section>

  <!-- 3. 플레이 화면 -->
  <section id="screen-play" class="hidden" style="flex:1; display:flex; flex-direction:column;">
    <header class="bar">
      <div class="row">
        <span class="title" id="playTitle"></span>
        <span class="scene" id="playScene"></span>
      </div>
      <div class="scenes" id="sceneChips"></div>
    </header>

    <div id="chat"></div>
    <div id="thinking" class="thinking hidden"><span class="dot">●</span><span class="dot">●</span><span class="dot">●</span> 배우들이 생각 중…</div>

    <footer class="input">
      <div id="awaitTip" class="await-tip hidden">💬 지금 당신에게 발언권이 왔습니다. 말을 걸어보세요.</div>
      <div class="inrow">
        <input id="say" type="text" placeholder="배우들에게 하고 싶은 말을 입력하세요…" autocomplete="off">
        <button id="sayBtn" class="btn send">말 걸기</button>
      </div>
      <div class="toolrow">
        <button id="advanceBtn" class="btn">▶ 진행 (한 마디 더 보기)</button>
        <button id="interviewBtn" class="btn">🎤 인터뷰</button>
        <button id="finishBtn" class="btn">평가하고 종료</button>
      </div>
    </footer>
  </section>
</div>

<!-- 인터뷰 모달 -->
<div id="ivOverlay" class="overlay hidden">
  <div class="modal">
    <button class="close" onclick="closeInterview()">✕</button>
    <h2>🎤 인터뷰 — 극을 멈추고 직접 질문</h2>
    <div class="sub" style="color:var(--muted);font-size:13px">배역을 고르고 궁금한 것을 물어보세요.</div>
    <div class="actorlist" id="ivActors"></div>
    <div class="ivlog" id="ivLog"></div>
    <div class="inrow">
      <input id="ivQ" type="text" placeholder="질문을 입력하세요…" autocomplete="off">
      <button id="ivAsk" class="btn send">질문</button>
    </div>
    <div id="ivErr" class="err"></div>
  </div>
</div>

<!-- 평가 모달 -->
<div id="fbOverlay" class="overlay hidden">
  <div class="modal">
    <h2>📝 극 평가</h2>
    <div class="sub" style="color:var(--muted);font-size:13px">경험을 짧게 평가해주세요. 연구 자료로 쓰입니다.</div>
    <div id="fbStars"></div>
    <label>자유 의견 (선택)</label>
    <textarea id="fbComment" rows="3" placeholder="인상 깊었던 점, 어색했던 점 등을 적어주세요."></textarea>
    <button id="fbSubmit" class="primary">제출하고 종료</button>
    <div id="fbErr" class="err"></div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
let SID = null, SCENARIO = null, POLL = null, BUSY = false, FINISHED = false;
let PLAYER = {name:'Edward Helson', display:'에드워드 헬슨 (나)'};   // 시나리오별로 갱신됨
let IV_ACTOR = null;
const colorMap = {};
function colorClass(role){ if(!(role in colorMap)) colorMap[role] = 'c'+(Object.keys(colorMap).length%6); return colorMap[role]; }

function show(id){ ['screen-start','screen-loading','screen-play'].forEach(s=>$('#'+s).classList.toggle('hidden', s!==id)); }
async function api(path, opts){ const r = await fetch(path, opts); if(!r.ok){ const e = await r.json().catch(()=>({error:'오류'})); throw new Error(e.error||('HTTP '+r.status)); } return r.json(); }

/* ---------- 시작 화면 ---------- */
async function loadScenarios(){
  const list = await api('/api/scenarios');
  const box = $('#scenarios'); box.innerHTML='';
  list.forEach((s,i)=>{
    const div = document.createElement('div');
    div.className = 'scenario' + (i===0?' sel':'');
    div.innerHTML = `<div class="t">${s.title}${s.lang!=='ko'?'<span class="tag">EN 지문</span>':''}</div><div class="i">${s.intro||''}</div>`;
    div.onclick = ()=>{ document.querySelectorAll('.scenario').forEach(x=>x.classList.remove('sel')); div.classList.add('sel'); SCENARIO=s.id; validate(); };
    box.appendChild(div);
    if(i===0) SCENARIO=s.id;
  });
  validate();
}
function validate(){ $('#startBtn').disabled = !($('#name').value.trim() && SCENARIO); }
$('#name').addEventListener('input', validate);

$('#startBtn').onclick = async ()=>{
  $('#startErr').textContent='';
  try{
    const r = await api('/api/start', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name:$('#name').value.trim(), scenario:SCENARIO})});
    SID = r.sid; show('screen-loading'); pollReady();
  }catch(e){ $('#startErr').textContent = e.message; }
};

/* ---------- 로딩 → 준비 완료 폴링 ---------- */
async function pollReady(){
  try{
    const st = await api('/api/state?sid='+SID);
    if(st.status==='error'){ $('#loadingMsg').innerHTML = '준비 중 오류가 발생했습니다:<br>'+(st.error||''); return; }
    if(st.status==='ready' || st.status==='finished'){ enterPlay(st); return; }
  }catch(e){ /* 무시하고 재시도 */ }
  setTimeout(pollReady, 2000);
}

/* ---------- 플레이 화면 ---------- */
function enterPlay(st){
  show('screen-play');
  if(st.player) PLAYER = st.player;
  $('#playTitle').textContent = st.title;
  renderScene(st.current_act, st.scenes);
  st.transcript.forEach(addMsg);
  scrollChat();
  buildInterviewActors(st.actors);
}
function renderScene(current, scenes){
  $('#playScene').textContent = current;
  const box = $('#sceneChips'); box.innerHTML='';
  scenes.forEach(s=>{
    const b = document.createElement('button');
    b.className = 'chip'+(s.current?' cur':'');
    b.textContent = (s.current?'📍 ':'→ ') + s.label;
    b.disabled = s.current || BUSY;
    b.onclick = ()=> doAction('move', {moveTo:s.name});
    box.appendChild(b);
  });
}
function addMsg(line){
  const div = document.createElement('div');
  if(line.is_narration) div.className='msg narration';
  else if(line.is_player) div.className='msg player';
  else div.className='msg';
  const bubbleCls = (line.is_narration||line.is_player)?'':(' '+colorClass(line.role));
  div.innerHTML = (line.is_narration?'':`<div class="who">${line.display}</div>`)+`<div class="bubble${bubbleCls}">${escapeHtml(line.content)}</div>`;
  $('#chat').appendChild(div);
}
function escapeHtml(s){ return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function scrollChat(){ const c=$('#chat'); c.scrollTop=c.scrollHeight; }
function setBusy(b){ BUSY=b; $('#thinking').classList.toggle('hidden',!b); ['sayBtn','advanceBtn','say'].forEach(id=>$('#'+id).disabled=b); document.querySelectorAll('#sceneChips .chip').forEach(c=>{ if(!c.classList.contains('cur')) c.disabled=b; }); if(b) scrollChat(); }

async function doAction(type, extra){
  if(BUSY||FINISHED) return;
  const payload = Object.assign({sid:SID, type}, extra||{});
  // 플레이어 발화는 즉시 화면에 먼저 보여준다.
  if(type==='talk'){ addMsg({role:PLAYER.name, display:PLAYER.display, content:payload.utterance, is_player:true}); scrollChat(); }
  setBusy(true);
  try{
    const r = await api('/api/action', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
    r.new_lines.forEach(addMsg);
    renderScene(r.current_act, r.scenes);
    $('#awaitTip').classList.toggle('hidden', !r.awaiting);
    if(r.finished){ FINISHED=true; onFinished(); }
  }catch(e){ addMsg({role:'Narration', display:'지문', content:'⚠️ '+e.message, is_narration:true}); }
  finally{ setBusy(false); scrollChat(); }
}

$('#sayBtn').onclick = ()=>{ const v=$('#say').value.trim(); if(!v) return; $('#say').value=''; doAction('talk',{utterance:v}); };
$('#say').addEventListener('keydown', e=>{ if(e.key==='Enter') $('#sayBtn').click(); });
$('#advanceBtn').onclick = ()=> doAction('none');
$('#finishBtn').onclick = ()=> openFeedback();

function onFinished(){
  $('#awaitTip').classList.add('hidden');
  addMsg({role:'Narration', display:'지문', content:'— 극이 끝났습니다. 이제 배우에게 자유롭게 인터뷰하거나 평가를 남길 수 있습니다. —', is_narration:true});
  $('#advanceBtn').disabled=true; $('#sayBtn').disabled=true; $('#say').disabled=true;
}

/* ---------- 인터뷰 ---------- */
function buildInterviewActors(actors){
  const box = $('#ivActors'); box.innerHTML='';
  actors.forEach(a=>{
    const b=document.createElement('button'); b.className='chip'; b.textContent=a.display;
    b.onclick = ()=>{ IV_ACTOR=a.role; document.querySelectorAll('#ivActors .chip').forEach(x=>x.classList.remove('cur')); b.classList.add('cur'); $('#ivQ').focus(); };
    box.appendChild(b);
  });
}
$('#interviewBtn').onclick = ()=>{ $('#ivLog').innerHTML=''; $('#ivErr').textContent=''; IV_ACTOR=null; document.querySelectorAll('#ivActors .chip').forEach(x=>x.classList.remove('cur')); $('#ivOverlay').classList.remove('hidden'); };
function closeInterview(){ if(IV_ACTOR){ fetch('/api/interview/end',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sid:SID,actor:IV_ACTOR})}); } $('#ivOverlay').classList.add('hidden'); }
$('#ivAsk').onclick = async ()=>{
  const q=$('#ivQ').value.trim(); if(!q) return;
  if(!IV_ACTOR){ $('#ivErr').textContent='먼저 배역을 선택하세요.'; return; }
  $('#ivErr').textContent=''; $('#ivQ').value=''; $('#ivAsk').disabled=true;
  const log=$('#ivLog'); log.innerHTML += `<div class="q">나: ${escapeHtml(q)}</div><div class="a" id="pending">…</div>`; log.scrollTop=log.scrollHeight;
  try{
    const r = await api('/api/interview',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sid:SID,actor:IV_ACTOR,question:q})});
    $('#pending').removeAttribute('id'); log.lastElementChild.textContent = r.display.replace(' (나)','') + ': ' + r.answer;
  }catch(e){ $('#ivErr').textContent=e.message; const p=$('#pending'); if(p)p.remove(); }
  finally{ $('#ivAsk').disabled=false; log.scrollTop=log.scrollHeight; }
};
$('#ivQ').addEventListener('keydown', e=>{ if(e.key==='Enter') $('#ivAsk').click(); });

/* ---------- 평가 ---------- */
const RATINGS = [
  ['immersion','몰입감 — 극에 빠져들었나요?'],
  ['character','캐릭터 일관성 — 배우들이 배역답게 행동했나요?'],
  ['plot','전개 자연스러움 — 이야기가 매끄럽게 흘렀나요?'],
];
const ratingVals = {};
function openFeedback(){
  const box=$('#fbStars'); box.innerHTML='';
  RATINGS.forEach(([key,label])=>{
    const wrap=document.createElement('div'); wrap.style.marginTop='14px';
    wrap.innerHTML=`<label>${label}</label>`;
    const stars=document.createElement('div'); stars.className='stars';
    for(let i=1;i<=5;i++){ const s=document.createElement('span'); s.textContent='★'; s.onclick=()=>{ ratingVals[key]=i; [...stars.children].forEach((c,idx)=>c.classList.toggle('on',idx<i)); }; stars.appendChild(s); }
    wrap.appendChild(stars); box.appendChild(wrap);
  });
  $('#fbErr').textContent=''; $('#fbOverlay').classList.remove('hidden');
}
$('#fbSubmit').onclick = async ()=>{
  $('#fbSubmit').disabled=true;
  try{
    await api('/api/feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sid:SID, ratings:ratingVals, comment:$('#fbComment').value})});
    $('#fbOverlay').innerHTML='<div class="modal" style="text-align:center"><h2>고맙습니다! 🙏</h2><div class="sub" style="color:var(--muted)">평가가 저장되었습니다. 창을 닫으셔도 됩니다.</div></div>';
  }catch(e){ $('#fbErr').textContent=e.message; $('#fbSubmit').disabled=false; }
};

loadScenarios();
</script>
</body>
</html>
